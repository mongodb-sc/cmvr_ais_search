<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b17"/>
      <stop offset="1" stop-color="#0a1512"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22343e"/><stop offset="1" stop-color="#1a2932"/>
    </linearGradient>
    <linearGradient id="ing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#264035"/><stop offset="1" stop-color="#1b2f27"/>
    </linearGradient>
    <linearGradient id="mdb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#124a37"/><stop offset="1" stop-color="#0c3527"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e42"/><stop offset="1" stop-color="#20222f"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#63d6a3"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="72" fill="#ffffff" font-size="32" font-weight="700">Regulatory Search Platform — Reference Architecture</text>
  <text x="60" y="106" fill="#8fb3a6" font-size="17">High-level view of the main components and data flow</text>

  <!-- ============ 1. REGULATORY SOURCES ============ -->
  <g filter="url(#sh)">
    <rect x="60" y="170" width="290" height="470" rx="16" fill="url(#src)" stroke="#3d5766" stroke-width="1.5"/>
  </g>
  <text x="205" y="212" fill="#eaf2f0" font-size="20" font-weight="700" text-anchor="middle">Regulatory Sources</text>
  <line x1="90" y1="228" x2="320" y2="228" stroke="#3d5766" stroke-width="1"/>

  <g>
    <rect x="90" y="252" width="230" height="80" rx="10" fill="#1b2b34" stroke="#3d5766"/>
    <text x="205" y="299" fill="#dce8ee" font-size="17" font-weight="600" text-anchor="middle">CMVR Rules</text>

    <rect x="90" y="346" width="230" height="80" rx="10" fill="#1b2b34" stroke="#3d5766"/>
    <text x="205" y="393" fill="#dce8ee" font-size="17" font-weight="600" text-anchor="middle">AIS Standards</text>

    <rect x="90" y="440" width="230" height="80" rx="10" fill="#1b2b34" stroke="#3d5766"/>
    <text x="205" y="480" fill="#dce8ee" font-size="17" font-weight="600" text-anchor="middle">Gazette</text>
    <text x="205" y="502" fill="#dce8ee" font-size="17" font-weight="600" text-anchor="middle">Notifications</text>

    <rect x="90" y="534" width="230" height="80" rx="10" fill="#1b2b34" stroke="#3d5766"/>
    <text x="205" y="581" fill="#dce8ee" font-size="17" font-weight="600" text-anchor="middle">ARAI Circulars</text>
  </g>

  <!-- ============ 2. INGESTION ============ -->
  <g filter="url(#sh)">
    <rect x="420" y="290" width="270" height="230" rx="16" fill="url(#ing)" stroke="#3f6a55" stroke-width="1.5"/>
  </g>
  <text x="555" y="356" fill="#dff3e8" font-size="20" font-weight="700" text-anchor="middle">Ingestion &amp;</text>
  <text x="555" y="384" fill="#dff3e8" font-size="20" font-weight="700" text-anchor="middle">Normalization</text>
  <text x="555" y="430" fill="#94b3a4" font-size="14.5" text-anchor="middle">Parse · standardize ·</text>
  <text x="555" y="452" fill="#94b3a4" font-size="14.5" text-anchor="middle">tag content</text>
  <text x="555" y="486" fill="#a9f0cd" font-size="14" font-weight="600" text-anchor="middle">voyage-4-large embeddings</text>

  <!-- ============ 3. MONGODB / KNOWLEDGE STORE ============ -->
  <g filter="url(#sh)">
    <rect x="760" y="200" width="330" height="410" rx="16" fill="url(#mdb2)" stroke="#2f9d6e" stroke-width="1.8"/>
  </g>
  <!-- MongoDB leaf icon -->
  <g transform="translate(792,222) scale(1.25)">
    <path d="M17.193 9.555c-1.264-5.58-4.252-7.414-4.573-8.115-.28-.394-.53-.954-.735-1.44-.036.495-.055.685-.523 1.184-.723.566-4.438 3.682-4.74 10.02-.282 5.912 4.27 9.435 4.888 9.884l.07.05A73.49 73.49 0 0 1 11.91 24h.481c.114-1.032.284-2.056.51-3.07.417-.296.604-.463.85-.693a11.342 11.342 0 0 0 3.639-8.464c.01-.814-.103-1.662-.197-2.218zm-5.336 8.195s0-8.291.275-8.29c.213 0 .49 10.695.49 10.695-.381-.045-.765-1.76-.765-2.405z" fill="#00ED64"/>
  </g>
  <text x="948" y="244" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Knowledge Store</text>
  <text x="948" y="268" fill="#8fe0b6" font-size="14" text-anchor="middle">MongoDB Atlas</text>
  <line x1="790" y1="284" x2="1060" y2="284" stroke="#2f8d63" stroke-width="1"/>

  <rect x="790" y="304" width="270" height="80" rx="10" fill="#0c2a20" stroke="#2f8d63"/>
  <text x="925" y="351" fill="#c9f6de" font-size="17" font-weight="600" text-anchor="middle">Source Records</text>

  <rect x="790" y="398" width="270" height="80" rx="10" fill="#0c2a20" stroke="#2f8d63"/>
  <text x="925" y="445" fill="#c9f6de" font-size="17" font-weight="600" text-anchor="middle">Metadata</text>

  <rect x="790" y="492" width="270" height="90" rx="10" fill="#0c2a20" stroke="#2f8d63"/>
  <text x="925" y="533" fill="#c9f6de" font-size="17" font-weight="600" text-anchor="middle">Search Index</text>
  <text x="925" y="558" fill="#95c9b1" font-size="13.5" text-anchor="middle">(hybrid retrieval)</text>

  <!-- ============ 4. APPLICATION ============ -->
  <g filter="url(#sh)">
    <rect x="1160" y="290" width="220" height="230" rx="16" fill="url(#app)" stroke="#4a4d66" stroke-width="1.5"/>
  </g>
  <text x="1270" y="356" fill="#e7e7f6" font-size="20" font-weight="700" text-anchor="middle">Search</text>
  <text x="1270" y="384" fill="#e7e7f6" font-size="20" font-weight="700" text-anchor="middle">Application</text>
  <text x="1270" y="430" fill="#a9abc8" font-size="14.5" text-anchor="middle">Query · rank ·</text>
  <text x="1270" y="452" fill="#a9abc8" font-size="14.5" text-anchor="middle">present results</text>

  <!-- ============ RANKED RESULTS ============ -->
  <g filter="url(#sh)">
    <rect x="760" y="660" width="620" height="120" rx="14" fill="#2c2412" stroke="#8a6d2e" stroke-width="1.5"/>
  </g>
  <text x="790" y="694" fill="#ffe6ad" font-size="18" font-weight="700">Ranked Results</text>
  <g font-size="14.5" fill="#ffe9bb" text-anchor="middle">
    <rect x="790" y="712" width="170" height="46" rx="8" fill="#403316" stroke="#7d6528"/>
    <text x="875" y="740">Title</text>
    <rect x="974" y="712" width="200" height="46" rx="8" fill="#403316" stroke="#7d6528"/>
    <text x="1074" y="740">Matched Passage</text>
    <rect x="1188" y="712" width="170" height="46" rx="8" fill="#403316" stroke="#7d6528"/>
    <text x="1273" y="740">Rule / Section</text>
  </g>
  <g font-size="13.5" fill="#cdb98a">
    <text x="790" y="775">plus  ·  Revision   ·   Status   ·   Relevance ranking</text>
  </g>

  <!-- ============ FLOW ARROWS ============ -->
  <path d="M350 405 C 385 405, 390 405, 420 405" stroke="#63d6a3" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>
  <path d="M690 405 C 720 405, 730 405, 760 405" stroke="#63d6a3" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>
  <path d="M1090 405 C 1120 405, 1130 405, 1160 405" stroke="#63d6a3" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>
  <!-- results down -->
  <path d="M1270 520 C 1270 600, 1180 640, 1120 660" stroke="#e6c46a" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>

  <text x="60" y="808" fill="#5f7a70" font-size="13">Sources flow into ingestion, are stored and indexed in the knowledge store, and served by the search application as ranked results.</text>
</svg>
