<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b17"/><stop offset="1" stop-color="#0a1512"/>
    </linearGradient>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#63d6a3"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb6bf"/>
    </marker>
    <marker id="final" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6c46a"/>
    </marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="52" fill="#ffffff" font-size="27" font-weight="700">Figure 2 · Hybrid-Retrieval Sequence</text>
  <text x="60" y="80" fill="#8fb3a6" font-size="15">Query preparation → parallel lexical &amp; vector search → fusion/reranking → active-version filtering → provenance-rich response</text>

  <!-- ===== Lifelines ===== -->
  <g stroke="#3a5261" stroke-width="1.4" stroke-dasharray="4 6">
    <line x1="140"  y1="158" x2="140"  y2="905"/>
    <line x1="445"  y1="158" x2="445"  y2="905"/>
    <line x1="730"  y1="158" x2="730"  y2="905"/>
    <line x1="1010" y1="158" x2="1010" y2="905"/>
    <line x1="1330" y1="158" x2="1330" y2="905"/>
  </g>

  <!-- ===== Participant headers ===== -->
  <g filter="url(#sh)">
    <rect x="40"   y="100" width="200" height="58" rx="10" fill="#22343e" stroke="#3d5766"/>
    <rect x="345"  y="100" width="200" height="58" rx="10" fill="#2c2e42" stroke="#4a4d66"/>
    <rect x="630"  y="100" width="200" height="58" rx="10" fill="#173a2a" stroke="#2f7a58"/>
    <rect x="910"  y="100" width="200" height="58" rx="10" fill="#0c3527" stroke="#2f9d6e" stroke-width="1.6"/>
    <rect x="1230" y="100" width="200" height="58" rx="10" fill="#173a2a" stroke="#2f7a58"/>
  </g>
  <text x="140"  y="126" fill="#eaf2f0" font-size="15" font-weight="700" text-anchor="middle">User</text>
  <text x="140"  y="146" fill="#9fb6bf" font-size="12" text-anchor="middle">engineer / analyst</text>

  <text x="445"  y="126" fill="#e7e7f6" font-size="15" font-weight="700" text-anchor="middle">Search Application</text>
  <text x="445"  y="146" fill="#a9abc8" font-size="12" text-anchor="middle">retrieval orchestrator</text>

  <text x="730"  y="126" fill="#d7f3e5" font-size="15" font-weight="700" text-anchor="middle">Embedding Model</text>
  <text x="730"  y="146" fill="#94b3a4" font-size="12" text-anchor="middle">voyage-4-large</text>

  <!-- MongoDB leaf -->
  <g transform="translate(938,110) scale(0.95)">
    <path d="M17.193 9.555c-1.264-5.58-4.252-7.414-4.573-8.115-.28-.394-.53-.954-.735-1.44-.036.495-.055.685-.523 1.184-.723.566-4.438 3.682-4.74 10.02-.282 5.912 4.27 9.435 4.888 9.884l.07.05A73.49 73.49 0 0 1 11.91 24h.481c.114-1.032.284-2.056.51-3.07.417-.296.604-.463.85-.693a11.342 11.342 0 0 0 3.639-8.464c.01-.814-.103-1.662-.197-2.218zm-5.336 8.195s0-8.291.275-8.29c.213 0 .49 10.695.49 10.695-.381-.045-.765-1.76-.765-2.405z" fill="#00ED64"/>
  </g>
  <text x="1030" y="126" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">MongoDB Atlas</text>
  <text x="1030" y="146" fill="#8fe0b6" font-size="12" text-anchor="middle">lexical + vector indexes</text>

  <text x="1330" y="126" fill="#d7f3e5" font-size="15" font-weight="700" text-anchor="middle">Reranker</text>
  <text x="1330" y="146" fill="#94b3a4" font-size="12" text-anchor="middle">rerank-2.5</text>

  <!-- ===== Activation bar on Search Application ===== -->
  <rect x="439" y="196" width="12" height="672" rx="3" fill="#3a3d57" stroke="#5a5d7a"/>

  <!-- ===== 1. User -> App ===== -->
  <line x1="140" y1="196" x2="439" y2="196" stroke="#63d6a3" stroke-width="2.4" marker-end="url(#call)"/>
  <text x="150" y="188" fill="#dbe9e3" font-size="13.5" font-weight="600">1 · Submit natural-language query</text>

  <!-- ===== 2. Query preparation (self) ===== -->
  <rect x="451" y="212" width="330" height="52" rx="8" fill="#242637" stroke="#4a4d66"/>
  <text x="466" y="234" fill="#eef" font-size="13.5" font-weight="600">2 · Query preparation</text>
  <text x="466" y="253" fill="#a9abc8" font-size="12">validate · normalize · set vector/lexical weights</text>

  <!-- ===== 3. App -> Embedding ===== -->
  <rect x="724" y="300" width="12" height="52" rx="3" fill="#1f4a37" stroke="#2f7a58"/>
  <line x1="451" y1="300" x2="724" y2="300" stroke="#63d6a3" stroke-width="2.4" marker-end="url(#call)"/>
  <text x="461" y="292" fill="#dbe9e3" font-size="13.5" font-weight="600">3 · Embed query</text>
  <line x1="724" y1="340" x2="451" y2="340" stroke="#9fb6bf" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ret)"/>
  <text x="461" y="333" fill="#9fb6bf" font-size="12">query vector (1024-d)</text>

  <!-- ===== par fragment for parallel search ===== -->
  <rect x="420" y="382" width="720" height="168" rx="6" fill="none" stroke="#4f7d6a" stroke-width="1.3" stroke-dasharray="3 4"/>
  <rect x="420" y="382" width="120" height="26" rx="4" fill="#173a2a" stroke="#4f7d6a"/>
  <text x="432" y="400" fill="#a9f0cd" font-size="12.5" font-weight="700">par · parallel</text>
  <text x="600" y="400" fill="#7fae97" font-size="12" font-style="italic">both queries scoped to the active document version</text>

  <!-- ===== 4. Lexical search ===== -->
  <rect x="1004" y="418" width="12" height="46" rx="3" fill="#0f4030" stroke="#2f9d6e"/>
  <line x1="451" y1="418" x2="1004" y2="418" stroke="#63d6a3" stroke-width="2.4" marker-end="url(#call)"/>
  <text x="461" y="410" fill="#dbe9e3" font-size="13.5" font-weight="600">4 · Lexical search — full-text BM25  · active-version filter</text>
  <line x1="1004" y1="452" x2="451" y2="452" stroke="#9fb6bf" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ret)"/>
  <text x="461" y="445" fill="#9fb6bf" font-size="12">ranked lexical hits</text>

  <!-- ===== 5. Vector search ===== -->
  <rect x="1004" y="484" width="12" height="46" rx="3" fill="#0f4030" stroke="#2f9d6e"/>
  <line x1="451" y1="484" x2="1004" y2="484" stroke="#63d6a3" stroke-width="2.4" marker-end="url(#call)"/>
  <text x="461" y="476" fill="#dbe9e3" font-size="13.5" font-weight="600">5 · Vector search — semantic kNN  · active-version filter</text>
  <line x1="1004" y1="518" x2="451" y2="518" stroke="#9fb6bf" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ret)"/>
  <text x="461" y="511" fill="#9fb6bf" font-size="12">ranked vector hits</text>

  <!-- ===== 6. Fusion (self) ===== -->
  <rect x="451" y="568" width="360" height="52" rx="8" fill="#242637" stroke="#4a4d66"/>
  <text x="466" y="590" fill="#eef" font-size="13.5" font-weight="600">6 · Fusion — Reciprocal Rank Fusion (k=60)</text>
  <text x="466" y="609" fill="#a9abc8" font-size="12">merge ranked lists → weighted candidate set</text>

  <!-- ===== 7. Rerank ===== -->
  <rect x="1324" y="656" width="12" height="52" rx="3" fill="#1f4a37" stroke="#2f7a58"/>
  <line x1="451" y1="656" x2="1324" y2="656" stroke="#63d6a3" stroke-width="2.4" marker-end="url(#call)"/>
  <text x="461" y="648" fill="#dbe9e3" font-size="13.5" font-weight="600">7 · Rerank candidates against the query</text>
  <line x1="1324" y1="696" x2="451" y2="696" stroke="#9fb6bf" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ret)"/>
  <text x="461" y="689" fill="#9fb6bf" font-size="12">top-k reordered with relevance scores</text>

  <!-- ===== 8. Active-version filtering (self) ===== -->
  <rect x="451" y="714" width="430" height="52" rx="8" fill="#2a3320" stroke="#6b8a3a"/>
  <text x="466" y="736" fill="#e9ffcb" font-size="13.5" font-weight="600">8 · Active-version filtering</text>
  <text x="466" y="755" fill="#c7d9a0" font-size="12">keep in-force revisions · drop superseded / draft entries</text>

  <!-- ===== 9. Assemble provenance (self) ===== -->
  <rect x="451" y="782" width="430" height="52" rx="8" fill="#332a12" stroke="#8a6d2e"/>
  <text x="466" y="804" fill="#ffe6ad" font-size="13.5" font-weight="600">9 · Assemble source provenance</text>
  <text x="466" y="823" fill="#cdb98a" font-size="12">title · matched passage · rule/section locator · revision · status</text>

  <!-- ===== 10. App -> User ===== -->
  <line x1="439" y1="868" x2="140" y2="868" stroke="#e6c46a" stroke-width="2.8" marker-end="url(#final)"/>
  <text x="150" y="860" fill="#ffe6ad" font-size="13.5" font-weight="700">10 · Ranked results + source provenance</text>

  <!-- footer -->
  <text x="60" y="960" fill="#5f7a70" font-size="12.5">Lexical and vector retrieval run in parallel over the active document version; results are fused, reranked, status-filtered, and returned with full provenance.</text>
</svg>
