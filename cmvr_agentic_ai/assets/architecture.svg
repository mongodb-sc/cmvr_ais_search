<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 620" width="1720" height="620" style="width:100%;height:auto;display:block" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="CMVR / AIS agentic test-finder architecture">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowsky" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="agentg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f6ff"/>
    </linearGradient>
    <style>
      .title{font-size:14px;font-weight:600;fill:#0f172a}
      .sub{font-size:11px;fill:#64748b}
      .h1{font-size:17px;font-weight:700;fill:#0f172a;letter-spacing:.2px}
      .h2{font-size:11.5px;fill:#94a3b8}
      .grp{font-size:12.5px;font-weight:700;fill:#b45309;letter-spacing:.3px}
      .card{fill:#ffffff;stroke:#e6eaf0;stroke-width:1.4;filter:url(#sh)}
      .edge{fill:none;stroke:#94a3b8;stroke-width:1.6;marker-end:url(#arrow)}
      .edash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#arrow)}
      .edot{fill:none;stroke:#38bdf8;stroke-width:1.6;stroke-dasharray:1.5 5;stroke-linecap:round;marker-end:url(#arrowsky)}
      .elab{font-size:10.5px;font-weight:600;fill:#475569;text-anchor:middle;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
      .wtitle{font-size:14px;font-weight:600;fill:#ffffff}
      .wsub{font-size:11px;fill:#cbd5e1}
      .leg{font-size:11px;fill:#475569}
      .legh{font-size:11px;font-weight:700;fill:#334155;letter-spacing:.4px}
    </style>
  </defs>

  <!-- canvas -->
  <rect x="6" y="6" width="1708" height="608" rx="20" fill="#ffffff" stroke="#eef1f5"/>

  <!-- header -->
  <text class="h1" x="40" y="42">CMVR / AIS Agentic Test-Finder</text>
  <text class="h2" x="41" y="60">Hybrid retrieval (vector + full-text) with Voyage rerank, orchestrated by a Claude agent loop</text>

  <!-- ============ EDGES (drawn under nodes) ============ -->
  <!-- User -> Agent -->
  <path class="edge" d="M200,301 L246,301"/>
  <!-- Grove <-> Agent (bidirectional) -->
  <path class="edge" d="M350,140 L350,193" marker-start="url(#arrow)"/>
  <text class="elab" x="350" y="169">messages API</text>
  <!-- Agent -> cmvr_search -->
  <path class="edge" d="M450,231 L556,226"/>
  <text class="elab" x="505" y="212">1 · first</text>
  <!-- cmvr_search -> Agent (return) -->
  <path class="edash" d="M556,250 L450,259"/>
  <text class="elab" x="505" y="272">rules + codes</text>
  <!-- Agent -> ais_search -->
  <path class="edge" d="M450,366 L556,369"/>
  <text class="elab" x="505" y="352">2 · cap 2</text>
  <!-- ais_search -> Agent (return) -->
  <path class="edash" d="M556,388 L450,392"/>
  <text class="elab" x="505" y="405">clauses + refs</text>
  <!-- cmvr_search -> Hybrid -->
  <path class="edge" d="M760,229 L836,236"/>
  <text class="elab" x="800" y="216">hybrid</text>
  <!-- ais_search -> Hybrid -->
  <path class="edge" d="M760,373 L836,388"/>
  <text class="elab" x="800" y="398">hybrid</text>
  <!-- internal: vector -> rankFusion -->
  <path class="edge" d="M1070,240 L1106,306"/>
  <!-- internal: text -> rankFusion -->
  <path class="edge" d="M1070,390 L1106,324"/>
  <!-- internal: rankFusion -> rerank -->
  <path class="edge" d="M1260,315 L1296,315"/>
  <!-- Hybrid -> cmvr_rules -->
  <path class="edot" d="M1460,250 L1536,250"/>
  <!-- Hybrid -> ais_rules -->
  <path class="edot" d="M1460,392 L1536,392"/>
  <!-- Agent -> Final answer -->
  <path class="edge" d="M350,406 L356,466"/>
  <text class="elab" x="392" y="440">answer</text>
  <!-- Final -> User (response) -->
  <path class="edash" d="M250,501 C 168,501 120,452 120,340"/>
  <text class="elab" x="150" y="430">cited answer</text>

  <!-- ============ NODES ============ -->
  <!-- User -->
  <g>
    <rect class="card" x="40" y="266" width="160" height="70" rx="14"/>
    <circle cx="60" cy="301" r="5" fill="#64748b"/>
    <text class="title" x="120" y="298" text-anchor="middle">User query</text>
    <text class="sub" x="120" y="316" text-anchor="middle">natural-language ask</text>
  </g>

  <!-- Grove gateway -->
  <g>
    <rect class="card" x="250" y="66" width="200" height="74" rx="14"/>
    <circle cx="270" cy="103" r="5" fill="#8b5cf6"/>
    <text class="title" x="350" y="99" text-anchor="middle">Grove gateway</text>
    <text class="sub" x="350" y="117" text-anchor="middle">Anthropic API · claude-fable-5</text>
  </g>

  <!-- Agent loop (hub) -->
  <g>
    <rect class="card" x="250" y="196" width="200" height="210" rx="16" style="fill:url(#agentg);stroke:#c7d2fe"/>
    <circle cx="270" cy="238" r="5" fill="#6366f1"/>
    <text x="288" y="242" font-size="13.5" font-weight="700" fill="#3730a3">Agent loop</text>
    <text class="sub" x="350" y="286" text-anchor="middle">raw Claude tool-use loop</text>
    <text class="sub" x="350" y="306" text-anchor="middle">plans · calls tools</text>
    <text class="sub" x="350" y="326" text-anchor="middle">enforces 2-call budget</text>
    <text class="sub" x="350" y="346" text-anchor="middle">composes citations</text>
  </g>

  <!-- cmvr_search -->
  <g>
    <rect class="card" x="560" y="196" width="200" height="66" rx="14"/>
    <circle cx="580" cy="229" r="5" fill="#10b981"/>
    <text class="title" x="660" y="227" text-anchor="middle">cmvr_search</text>
    <text class="sub" x="660" y="245" text-anchor="middle">CMVR rules → AIS codes</text>
  </g>

  <!-- ais_search -->
  <g>
    <rect class="card" x="560" y="340" width="200" height="66" rx="14"/>
    <circle cx="580" cy="373" r="5" fill="#10b981"/>
    <text class="title" x="660" y="371" text-anchor="middle">ais_search</text>
    <text class="sub" x="660" y="389" text-anchor="middle">AIS clauses · AIS_id pre-filter</text>
  </g>

  <!-- Hybrid retrieval container -->
  <g>
    <rect x="840" y="150" width="620" height="330" rx="18" fill="#fffdf5" stroke="#fcd34d" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text class="grp" x="868" y="180">SHARED HYBRID RETRIEVAL + RERANK</text>

    <rect class="card" x="880" y="210" width="190" height="60" rx="12"/>
    <circle cx="898" cy="240" r="5" fill="#f59e0b"/>
    <text class="title" x="975" y="238" text-anchor="middle">$vectorSearch</text>
    <text class="sub" x="975" y="256" text-anchor="middle">voyage-4-large · 1024d</text>

    <rect class="card" x="880" y="360" width="190" height="60" rx="12"/>
    <circle cx="898" cy="390" r="5" fill="#f59e0b"/>
    <text class="title" x="975" y="388" text-anchor="middle">$search</text>
    <text class="sub" x="975" y="406" text-anchor="middle">Atlas full-text</text>

    <rect class="card" x="1110" y="285" width="150" height="60" rx="12"/>
    <circle cx="1128" cy="315" r="5" fill="#f59e0b"/>
    <text class="title" x="1185" y="313" text-anchor="middle">$rankFusion</text>
    <text class="sub" x="1185" y="331" text-anchor="middle">score fusion</text>

    <rect class="card" x="1300" y="285" width="140" height="60" rx="12"/>
    <circle cx="1318" cy="315" r="5" fill="#f59e0b"/>
    <text class="title" x="1370" y="313" text-anchor="middle">rerank-2.5</text>
    <text class="sub" x="1370" y="331" text-anchor="middle">Voyage</text>
  </g>

  <!-- MongoDB: cmvr_rules -->
  <g>
    <path class="card" d="M1540,220 a75,10 0 0 1 150,0 v54 a75,10 0 0 1 -150,0 z" style="fill:#f0f9ff;stroke:#7dd3fc"/>
    <ellipse cx="1615" cy="220" rx="75" ry="10" style="fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.4"/>
    <text class="title" x="1615" y="253" text-anchor="middle">cmvr_rules</text>
    <text class="sub" x="1615" y="271" text-anchor="middle">177 rules</text>
  </g>

  <!-- MongoDB: ais_rules -->
  <g>
    <path class="card" d="M1540,362 a75,10 0 0 1 150,0 v54 a75,10 0 0 1 -150,0 z" style="fill:#f0f9ff;stroke:#7dd3fc"/>
    <ellipse cx="1615" cy="362" rx="75" ry="10" style="fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.4"/>
    <text class="title" x="1615" y="395" text-anchor="middle">ais_rules</text>
    <text class="sub" x="1615" y="413" text-anchor="middle">3,139 clauses</text>
  </g>

  <!-- Final answer -->
  <g>
    <rect class="card" x="250" y="470" width="280" height="62" rx="14" style="fill:#0f172a;stroke:#0f172a"/>
    <circle cx="272" cy="501" r="5" fill="#38bdf8"/>
    <text class="wtitle" x="390" y="498" text-anchor="middle">Final answer</text>
    <text class="wsub" x="390" y="516" text-anchor="middle">with rule &amp; AIS citations</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="600" y="452" width="234" height="118" rx="12" fill="#ffffff" stroke="#eef1f5"/>
    <text class="legh" x="618" y="474">LEGEND</text>
    <path class="edge" d="M618,496 L660,496"/>
    <text class="leg" x="670" y="500">agent tool call</text>
    <path class="edash" d="M618,522 L660,522"/>
    <text class="leg" x="670" y="526">return / response</text>
    <path class="edot" d="M618,548 L660,548"/>
    <text class="leg" x="670" y="552">collection query</text>
  </g>
</svg>
